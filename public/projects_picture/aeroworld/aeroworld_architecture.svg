<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AeroWorld reliability-gated visual dynamics architecture</title>
  <desc id="desc">Camera frames and control plus IMU history form separate temporal branches. The visual branch predicts a gated residual that is added to the frozen baseline prediction.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102731"/>
      <stop offset="1" stop-color="#173b48"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#91bbc5"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#061116" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <path d="M0 735 C310 640 500 830 790 724S1290 615 1600 735V900H0Z" fill="#0c2028" opacity=".7"/>
  <g opacity=".09" stroke="#d8edf2">
    <path d="M0 110H1600M0 220H1600M0 330H1600M0 440H1600M0 550H1600M0 660H1600M0 770H1600"/>
    <path d="M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/>
  </g>
  <text x="100" y="105" fill="#f5f2ea" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">AeroWorld-V3</text>
  <text x="100" y="152" fill="#a8cbd3" font-family="Inter, Arial, sans-serif" font-size="24" letter-spacing="1">RELIABILITY-GATED VISUAL DYNAMICS PREDICTION</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="100" y="245" width="255" height="154" rx="18" fill="#f4f2ec"/>
    <text x="132" y="294" fill="#d96740" font-size="19" font-weight="700">VISUAL HISTORY</text>
    <text x="132" y="337" fill="#111820" font-size="29" font-weight="700">8 RGB frames</text>
    <text x="132" y="371" fill="#5d6870" font-size="19">20 Hz · 0.35 s span</text>

    <rect x="437" y="245" width="275" height="154" rx="18" fill="#e8f1f3" stroke="#5f99a8" stroke-width="2"/>
    <text x="469" y="294" fill="#0c5c73" font-size="19" font-weight="700">FROZEN ENCODER</text>
    <text x="469" y="337" fill="#111820" font-size="29" font-weight="700">ResNet-18</text>
    <text x="469" y="371" fill="#5d6870" font-size="19">features + differences</text>

    <rect x="794" y="245" width="285" height="154" rx="18" fill="#e8f1f3" stroke="#5f99a8" stroke-width="2"/>
    <text x="826" y="294" fill="#0c5c73" font-size="19" font-weight="700">TEMPORAL VISION</text>
    <text x="826" y="337" fill="#111820" font-size="29" font-weight="700">Visual GRU</text>
    <text x="826" y="371" fill="#5d6870" font-size="19">bounded residual + gate</text>

    <rect x="100" y="516" width="255" height="154" rx="18" fill="#f4f2ec"/>
    <text x="132" y="565" fill="#d96740" font-size="19" font-weight="700">MOTION HISTORY</text>
    <text x="132" y="608" fill="#111820" font-size="29" font-weight="700">Control + IMU</text>
    <text x="132" y="642" fill="#5d6870" font-size="19">7 channels · 8 steps</text>

    <rect x="437" y="516" width="275" height="154" rx="18" fill="#f4f2ec" stroke="#d8cec4" stroke-width="2"/>
    <text x="469" y="565" fill="#7e4a35" font-size="19" font-weight="700">FROZEN BASELINE</text>
    <text x="469" y="608" fill="#111820" font-size="29" font-weight="700">Control GRU</text>
    <text x="469" y="642" fill="#5d6870" font-size="19">base displacement</text>

    <circle cx="1187" cy="520" r="65" fill="#d96740"/>
    <text x="1187" y="532" fill="#fff" text-anchor="middle" font-size="44" font-weight="500">+</text>

    <rect x="1304" y="443" width="232" height="154" rx="18" fill="#f4f2ec"/>
    <text x="1336" y="491" fill="#0c5c73" font-size="19" font-weight="700">PREDICTION</text>
    <text x="1336" y="535" fill="#111820" font-size="27" font-weight="700">Future 3D</text>
    <text x="1336" y="568" fill="#5d6870" font-size="19">0.2 · 0.5 · 1.0 s</text>
  </g>

  <g fill="none" stroke="#91bbc5" stroke-width="5" marker-end="url(#arrow)">
    <path d="M355 322H421"/>
    <path d="M712 322H778"/>
    <path d="M355 593H421"/>
    <path d="M1079 322C1148 322 1120 423 1160 458"/>
    <path d="M712 593C915 593 1023 551 1111 529"/>
    <path d="M1252 520H1288"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="889" y="430" width="174" height="50" rx="25" fill="#0c5c73" stroke="#91bbc5"/>
    <text x="976" y="462" fill="#e9f4f6" text-anchor="middle" font-size="18" font-weight="700">gate × residual</text>
    <text x="100" y="815" fill="#b8d0d6" font-size="21">The pretrained control predictor is retained; vision can only propose a gated correction.</text>
    <text x="1497" y="815" fill="#7daab5" text-anchor="end" font-size="18">Offline forecasting · real-flight recordings</text>
  </g>
</svg>
